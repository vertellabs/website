<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Vertel Labs</title>
  <meta name="description" content="vertellabs.com is under construction. Write to contact@vertellabs.com.">
  <link rel="canonical" href="https://vertellabs.com/">

  <!-- Vertel Labs brand (from website-kit) -->
  <link rel="preload" href="fonts/VertelRound-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/VertelRound-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/vertel-round.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141213" media="(prefers-color-scheme: dark)">
  <!-- Use the visitor's saved light/dark choice before the page paints (no flash). -->
  <script>document.documentElement.className+=' js intro-on';try{var t=localStorage.getItem('vl-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vertel Labs">
  <meta property="og:title" content="Vertel Labs">
  <meta property="og:description" content="Digital Solutions for Businesses in Sri Lanka">
  <meta property="og:url" content="https://vertellabs.com/">
  <meta property="og:image" content="https://vertellabs.com/img/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vertel Labs">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/site.css?v=14">
</head>
<body class="uc">

  <!-- Intro while the page loads (DRAFT — logo motion isn't in the brand docs yet):
       the Vertel coin is traced, fills in, empties, and the line wipes away, on the dot background.
       It fades out once the page has loaded and the coin is full. Only shows when JavaScript runs.
       Path copied unchanged from assets/coin/crimson/vertel-mark-crimson.svg. -->
  <div class="intro" id="intro" aria-hidden="true">
    <svg class="coin-loader" viewBox="0 0 256 256">
      <path class="cl-coin" pathLength="100" d="M201.92 60.65 L123.2 197 A6 6 0 0 1 112.8 197 L62.74 110.28 A6 6 0 0 1 69.29 100.87 C119.03 113.8 159.35 86.73 188.51 48.38 A100 100 0 1 0 201.92 60.65 Z"/>
    </svg>
  </div>

  <header class="top wrap">
    <a class="logo" href="./" aria-label="Vertel Labs home">
      <img class="only-light" src="logo/vertel-logo-two-line-crimson.svg" alt="Vertel Labs" width="107" height="40">
      <img class="only-dark" src="logo/vertel-logo-two-line-on-dark.svg" alt="Vertel Labs" width="107" height="40">
    </a>
    <div class="top-right">
      <p class="local" aria-label="Local time in Sri Lanka">
        <span class="dot" aria-hidden="true"></span>
        <span>Sri Lanka</span>
        <span class="local-sep" aria-hidden="true"></span>
        <span class="local-time" id="clock">GMT+5:30</span>
      </p>

      <!-- Light/dark switch: a coin. Front = sun or moon, back = Vertel coin mark. -->
      <button class="theme-coin" type="button" id="theme-coin" aria-label="Switch to dark mode" title="Switch light / dark">
        <span class="coin" aria-hidden="true">
          <span class="coin-face coin-front">
            <!-- Vertel Labs light icon: solid sun, long rays at the four main points, short between (like ruler marks) -->
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M19 12h3M12 19v3M5 12H2M12 5V2M17.02 17.02l1.06 1.06M6.98 17.02l-1.06 1.06M6.98 6.98L5.92 5.92M17.02 6.98l1.06-1.06" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <!-- Vertel Labs dark icon: slim solid crescent with softened tips, and one small dot -->
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M8.02 4.81A8.6 8.6 0 1 0 19.19 15.98A8 8 0 0 1 8.02 4.81Z" fill="currentColor" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="18.6" cy="5.6" r="1.2" fill="currentColor"/></svg>
          </span>
          <span class="coin-face coin-back">
            <img class="coin-mark only-light" src="logo/vertel-mark-crimson-small.svg" alt="" width="20" height="20">
            <img class="coin-mark only-dark" src="logo/vertel-mark-on-dark-small.svg" alt="" width="20" height="20">
          </span>
        </span>
      </button>
    </div>
  </header>

  <main class="uc-main wrap">
    <div class="uc-art">
      <img class="only-light" src="img/under-construction.svg?v=3" alt="Road barrier with a flashing light and traffic cones" width="805" height="726">
      <img class="only-dark" src="img/under-construction-dark.svg?v=3" alt="Road barrier with a flashing light and traffic cones" width="805" height="726">
    </div>

    <div class="uc-copy">
      <h1>Under construction.</h1>
      <p class="lead">We’re doing some work on the site right now. It will be back soon</p>

      <div class="progress" aria-hidden="true"><span></span></div>

      <a class="contact-pill" href="mailto:contact@vertellabs.com" aria-label="Email us at contact@vertellabs.com">
        <span class="cp-text">contact@vertellabs.com</span>
        <span class="cp-go" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M6 14L14 6m-6.5 0H14v6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </main>

  <footer class="uc-foot">
    <div class="wrap uc-foot-inner">
      <span>© <span id="year">2026</span> Vertel Labs</span>
      <span class="promise">Built with Purpose</span>
    </div>
    <div class="tape" aria-hidden="true"></div>
  </footer>

  <script src="js/site.js?v=12" defer></script>
</body>
</html>
